
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: gta6-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./src/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  collector:
    build:
      context: .
      dockerfile: src/collector/Dockerfile
    container_name: gta6-collector
    env_file:
      - ./src/collector/.env
    volumes:
      - ./src/processor/input:/app/processor/input
    restart: "no"

  processor:
    build:
      context: .
      dockerfile: src/processor/Dockerfile
    container_name: gta6-processor
    depends_on:
      collector:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started  
    volumes:
      - ./src/processor:/app/processor
    restart: "no"
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"

  kuksa:
    image: ghcr.io/eclipse-kuksa/kuksa-databroker:latest
    container_name: gta6-kuksa
    command: ["--insecure", "--address", "0.0.0.0", "--port", "55555"]
    ports:
      - "55555:55555"
    restart: unless-stopped

volumes:
   mosquitto-data:
